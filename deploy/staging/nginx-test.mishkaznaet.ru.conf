# /etc/nginx/sites-available/test.mishkaznaet.ru  (nginx 1.18)
# Включение: ln -s /etc/nginx/sites-available/test.mishkaznaet.ru /etc/nginx/sites-enabled/
# Сертификат: sudo certbot --nginx -d test.mishkaznaet.ru
# certbot сам добавит listen 443 ssl + ssl_certificate и редирект HTTP->HTTPS
# (выберите "Redirect"). Блок ниже уже содержит всё остальное.

server {
    listen 80;
    listen [::]:80;
    server_name test.mishkaznaet.ru;

    # HTTP-01 challenge certbot — без basic auth
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/html;
        default_type "text/plain";
    }

    client_max_body_size 10m;   # картинки чата до 8 МБ

    # Закрываем от посторонних и поисковиков
    auth_basic "Staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Перезаписываем (а не дополняем) — приложение берёт последний IP
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # SSE-стриминг чата
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
